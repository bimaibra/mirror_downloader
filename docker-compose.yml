version: '3.8'

services:
  mirror-bot:
    build: .
    container_name: mirror-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./config.py:/app/config.py
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json
      # Mount .env if you want to use it directly, though env_file handles loading vars
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - TEMP_DOWNLOAD_DIR=/app/downloads
      - IS_DOCKER=true

  # Optional: Redis for Celery if enabled
  # redis:
  #   image: redis:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
